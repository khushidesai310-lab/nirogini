<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Nirogini</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon"><img src="images/nirogini_logo.png" style="width:32px;height:32px;object-fit:contain;"></div>
      <div class="auth-brand-name">Nirogini</div>
    </div>

    <h2 id="title" style="margin-bottom:6px;font-size:1.4rem;">Welcome! Let's get started 🌸</h2>
    <p id="subtitle" style="color:var(--text-dim);font-size:0.9rem;margin-bottom:24px;">Because you deserve to feel good too</p>

    <div class="error-msg" id="errorBox"></div>

    <form id="signupForm">
      <div class="field">
        <label id="nameLabel">Your name</label>
        <input type="text" id="name" placeholder="What should we call you?" required>
      </div>
      <div class="field">
        <label id="emailLabel">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label id="pwLabel">Password</label>
        <input type="password" id="password" required autocomplete="new-password">
        <div class="strength-meter"><div></div><div></div><div></div><div></div><div></div></div>
        <div class="strength-hint" id="strengthHint"></div>
      </div>
      <div class="field">
        <label id="cpwLabel">Confirm password</label>
        <input type="password" id="confirmPassword" required>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Join Nirogini 🌸</button>
    </form>

    <div class="form-foot" id="loginLink">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const lang = Lang.get();
if (lang === "hi") {
  document.getElementById("title").textContent = "आपका स्वागत है! 🌸";
  document.getElementById("subtitle").textContent = "क्योंकि आप भी deserve करती हैं अच्छा feel करना";
  document.getElementById("nameLabel").textContent = "आपका नाम";
  document.getElementById("emailLabel").textContent = "Email";
  document.getElementById("pwLabel").textContent = "Password";
  document.getElementById("cpwLabel").textContent = "Password confirm करें";
  document.getElementById("submitBtn").textContent = "Nirogini join करें 🌸";
  document.getElementById("loginLink").innerHTML = 'पहले से account है? <a href="login.html">Login करें</a>';
  document.getElementById("name").placeholder = "हम आपको क्या बुलाएं?";
}

if (Auth.getToken()) window.location.href = "dashboard.html";

const strengthMeter = document.querySelector(".strength-meter");
const strengthHint = document.getElementById("strengthHint");
document.getElementById("password").addEventListener("input", function() {
  renderStrengthMeter(strengthMeter, strengthHint, this.value);
});

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorBox = document.getElementById("errorBox");
  btn.disabled = true;
  btn.textContent = lang === "hi" ? "Join हो रहे हैं..." : "Joining...";

  const result = await apiCall("/api/signup", {
    method: "POST",
    body: {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      confirm_password: document.getElementById("confirmPassword").value,
      language: lang,
    }
  });

  if (result && result.success) {
    Auth.setToken(result.token);
    Auth.setUser(result.user);
    window.location.href = "onboarding.html";
  } else {
    showError(errorBox, (result && result.error) || "Something went wrong. Please try again.");
    btn.disabled = false;
    btn.textContent = lang === "hi" ? "Nirogini join करें 🌸" : "Join Nirogini 🌸";
  }
});
</script>
</body>
</html>
